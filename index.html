<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Siddhesh Kulkarni – Homoeopathy Consultations</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbfaf2;--card:#fff;--ink:#16301e;--mute:#4d6354;--green:#0f5a2c;--lime:#3fb52e;--soft:#e3eed3;--line:#cfdcc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a13;--card:#16241b;--ink:#e8f2e6;--mute:#a3b8a8;--green:#7fd68a;--lime:#5fd04c;--soft:#1d3324;--line:#2b4234}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a13;--card:#16241b;--ink:#e8f2e6;--mute:#a3b8a8;--green:#7fd68a;--lime:#5fd04c;--soft:#1d3324;--line:#2b4234}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--green);font-size:1.15rem}
.logo span{color:var(--lime)}
nav a{color:var(--ink);text-decoration:none;margin-left:14px;font-size:.95rem}
.langs{display:flex;gap:6px}
.langs button{font:600 .85rem inherit;color:var(--green);background:transparent;border:1.5px solid var(--green);border-radius:20px;padding:4px 12px;cursor:pointer}
.langs button.on{background:var(--green);color:var(--bg)}
.hero{padding:48px 0 32px;display:grid;gap:24px;grid-template-columns:1.3fr 1fr;align-items:center}
h1{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.15;margin:0 0 12px;color:var(--green)}
.tag{color:var(--mute);margin:0 0 20px}
.btn{display:inline-block;background:var(--green);color:var(--bg);padding:12px 22px;border:0;border-radius:10px;font:600 1rem inherit;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--green);border:2px solid var(--green);margin-left:8px}
.badge{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:20px}
.badge b{color:var(--green);display:block}
section{padding:36px 0}
h2{color:var(--green);font-size:1.7rem;margin:0 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.price{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:10px;overflow:hidden;margin-bottom:10px}
.price span{padding:12px 16px;font-weight:600}
.price b{background:var(--green);color:var(--bg);padding:12px 20px;font-size:1.3rem}
form{display:grid;gap:12px}
label{font-weight:600;font-size:.9rem;display:grid;gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.stars{display:flex;gap:4px;font-size:2rem;cursor:pointer;user-select:none}
.stars span{color:var(--line)}
.stars span.on{color:#e8a800}
.note{font-size:.85rem;color:var(--mute);margin:0}
[hidden]{display:none!important}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:.9rem}
@media(max-width:700px){.hero{grid-template-columns:1fr}.row{grid-template-columns:1fr}nav{display:none}.btn.alt{margin:8px 0 0}}
</style>
</head>

<section id="review"><h2 data-i="rev_h"></h2>

<div><div class="note" style="margin-bottom:4px"><b data-i="rating"></b></div><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div>
<label><span data-i="f_review"></span><textarea name="text" rows="3" required></textarea></label>
<button class="btn" type="submit" data-i="b_rev"></button>
</form></div></div></section>

<section id="contact"><h2 data-i="contact_h"></h2>
<div class="grid">
<div class="card"><b>Dr. Siddhesh Kulkarni, BHMS</b><br>Borivali</div>
<div class="card"><span data-i="call"></span>: <a href="tel:+918779646306">+91 8779646306</a><br><span data-i="email"></span>: <a href="mailto:siddheshkulkarni13@gmail.com">siddheshkulkarni13@gmail.com</a><br><br><a class="btn" href="https://wa.me/918779646306" target="_blank" rel="noopener" data-i="chat"></a></div>
</div></section>
</main>

function setLang(l){

document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=T[l][el.getAttribute("data-i")];});

var h=document.createElement("p");h.style.cssText="margin:0 0 12px;font-weight:700";

}
